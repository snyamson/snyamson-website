<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Solid ground with a heavy mark, not the hairline logo used in the nav.
    A favicon is read at 16px: an outlined square with a 1.5px stroke turns
    to mush at that size, so this inverts to a filled tile and thickens the
    S until it survives.
  -->
  <rect width="32" height="32" rx="7" fill="#053D3A"/>
  <path
    d="M22 10.5H13.6a2.6 2.6 0 0 0 0 5.2h4.8a2.6 2.6 0 0 1 0 5.2H10"
    fill="none"
    stroke="#FFE2B8"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
